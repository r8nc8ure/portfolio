let language=localStorage.getItem('r8nc8ure-language')==='ru'?'ru':'en';
const originalText=new WeakMap();
function translatePage(){
const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement?.closest('script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
while(walker.nextNode()){const n=walker.currentNode;let saved=originalText.get(n);if(!saved||n.nodeValue!==saved.last){saved={en:n.nodeValue,last:n.nodeValue};originalText.set(n,saved)}let value=saved.en;if(language==='ru'){for(const [en,ru]of Object.entries(translations).sort((a,b)=>b[0].length-a[0].length)){if(value.trim()===en){value=value.replace(en,ru);break}}value=value.replace(' — About me',' — Обо мне').replace(' — Collaborative projects',' — Совместные проекты')}if(n.nodeValue!==value)n.nodeValue=value;saved.last=value;}
document.documentElement.lang=language;document.getElementById('language').textContent=language==='en'?'RU':'EN';document.getElementById('language').ariaLabel=language==='en'?'Switch to Russian':'Переключить на английский';
}
const languageObserver=new MutationObserver(()=>{languageObserver.disconnect();translatePage();observeLanguage()});function observeLanguage(){languageObserver.observe(document.body,{subtree:true,childList:true,characterData:true})}
document.getElementById('language').onclick=()=>{languageObserver.disconnect();language=language==='en'?'ru':'en';localStorage.setItem('r8nc8ure-language',language);translatePage();observeLanguage()};
const mainWindow=document.querySelector('.hero-window');const dock=document.querySelector('.dock');const restore=document.createElement('button');restore.id='restoreWindow';restore.textContent='R8';restore.title='Restore window';restore.setAttribute('aria-label','Restore window');dock.prepend(restore);function showWindow(){mainWindow.hidden=false;mainWindow.classList.remove('window-hidden');restore.classList.remove('window-sleep');}function hideWindow(){mainWindow.classList.add('window-hidden');mainWindow.hidden=true;restore.classList.add('window-sleep');restore.focus()}
restore.onclick=showWindow;const red=document.querySelector('.lights .red'),yellow=document.querySelector('.lights .yellow'),green=document.querySelector('.lights .green');red.title='Close';yellow.title='Minimize';green.title='Maximize / Restore';for(const button of [red,yellow,green])button.setAttribute('aria-label',button.title);red.onclick=hideWindow;yellow.onclick=hideWindow;green.onclick=()=>mainWindow.classList.toggle('window-maximized');document.addEventListener('keydown',e=>{if(e.key==='Escape')mainWindow.classList.remove('window-maximized')});document.querySelector('.apple').onclick=showWindow;
render(works.me);translatePage();observeLanguage();
